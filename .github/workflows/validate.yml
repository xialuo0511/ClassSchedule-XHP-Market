name: Validate XHP market

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate market metadata and packages
        run: python scripts/validate_market.py

      - name: Check minimum host version enforcement
        run: python -m unittest discover -s tests -v

      - name: Check Shijian plugin workflow
        run: node --test plugins/dev.xinghan.shijian-connect/tests/workflow.test.js
